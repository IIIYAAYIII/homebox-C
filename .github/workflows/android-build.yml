name: Build Android APK

'on':
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_release:
        description: 'Publish APK to GitHub Releases (发布到项目 Release 页面)'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Release Tag (留空根据已有Release自动+0.0.1，如无则为v1.0.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version (+0.0.1 from last release)
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import urllib.request
          import subprocess

          repo = os.environ.get("GITHUB_REPOSITORY")
          token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
          custom_tag = (os.environ.get("CUSTOM_TAG") or "").strip()
          github_ref = os.environ.get("GITHUB_REF", "")

          final_tag = None
          clean_ver = None

          if github_ref.startswith("refs/tags/"):
              final_tag = github_ref.replace("refs/tags/", "")
              clean_ver = re.sub(r"^[vV]", "", final_tag)
              print(f"Triggered by git tag: {final_tag}")
          elif custom_tag and custom_tag.lower() != "auto":
              final_tag = custom_tag
              clean_ver = re.sub(r"^[vV]", "", final_tag)
              print(f"Using manual input tag: {final_tag}")
          else:
              # 1. Fetch published releases from GitHub Releases page
              releases = []
              try:
                  url = f"https://api.github.com/repos/{repo}/releases?per_page=100"
                  req = urllib.request.Request(url)
                  if token:
                      req.add_header("Authorization", f"Bearer {token}")
                  req.add_header("Accept", "application/vnd.github+json")
                  req.add_header("User-Agent", "GitHubActions-AutoVersion")
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      if isinstance(data, list):
                          releases = [r for r in data if not r.get("draft")]
              except Exception as e:
                  print(f"Releases REST API check notice: {e}")

              # Fallback to gh CLI if REST API was rate-limited or empty
              if not releases:
                  try:
                      cmd = ["gh", "release", "list", "--repo", repo, "--exclude-drafts", "--limit", "100", "--json", "tagName"]
                      out = subprocess.check_output(cmd, text=True, stderr=subprocess.DEVNULL)
                      data = json.loads(out)
                      if isinstance(data, list):
                          releases = data
                  except Exception as e:
                      print(f"gh release list check notice: {e}")

              # Parse semantic versions from published releases on the Releases page
              valid_versions = []
              for r in releases:
                  t = r.get("tagName") or r.get("tag_name") or ""
                  t = t.strip()
                  m = re.match(r"^[vV]?(\d+)\.(\d+)(?:\.(\d+))?$", t)
                  if m:
                      major = int(m.group(1))
                      minor = int(m.group(2))
                      patch = int(m.group(3) or 0)
                      valid_versions.append((major, minor, patch, t))

              if valid_versions:
                  # Sort by semantic version to get the highest published version on Releases page
                  valid_versions.sort(key=lambda x: (x[0], x[1], x[2]))
                  last_major, last_minor, last_patch, last_tag = valid_versions[-1]
                  next_patch = last_patch + 1
                  clean_ver = f"{last_major}.{last_minor}.{next_patch}"
                  final_tag = f"v{clean_ver}"
                  print(f"Last version found on published Releases page: {last_tag} ({last_major}.{last_minor}.{last_patch})")
                  print(f"Calculated next version (+0.0.1): {final_tag}")
              else:
                  # None exists on published Releases page: default to 1.0.0
                  print("No published releases exist on Releases page. Defaulting to 1.0.0")
                  clean_ver = "1.0.0"
                  final_tag = "v1.0.0"

          # Compute integer versionCode for Android (e.g. 1.0.0 -> 10000, 1.0.1 -> 10001)
          m = re.match(r"^(\d+)\.(\d+)(?:\.(\d+))?", clean_ver)
          if m:
              major = int(m.group(1))
              minor = int(m.group(2))
              patch = int(m.group(3) or 0)
              version_code = major * 10000 + minor * 100 + patch
          else:
              version_code = 10000

          print(f"::notice ::Target Release Tag: {final_tag}, Version Name: {clean_ver}, Version Code: {version_code}")

          # Write to GITHUB_OUTPUT and GITHUB_ENV
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"final_tag={final_tag}\n")
                  f.write(f"version_name={clean_ver}\n")
                  f.write(f"version_code={version_code}\n")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as f:
                  f.write(f"FINAL_TAG={final_tag}\n")
                  f.write(f"VERSION_NAME={clean_ver}\n")
                  f.write(f"VERSION_CODE={version_code}\n")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Signing Keystore
        id: prepare_keystore
        env:
          RAW_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RAW_KEYSTORE_BASE64" ]; then
            echo "Release keystore secret detected. Decoding..."
            mkdir -p android/keystore
            printf '%s' "$RAW_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/keystore/release.keystore
            
            if [ ! -s android/keystore/release.keystore ]; then
              echo "Error: Keystore file is empty after base64 decoding!"
              exit 1
            fi
            
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/keystore/release.keystore" >> $GITHUB_ENV
            
            KEYSTORE_PASS="${RAW_KEYSTORE_PASSWORD:-HbSecure@2026!Key}"
            KEY_ALIAS_VAL="${RAW_KEY_ALIAS:-homebox}"
            KEY_PASS="${RAW_KEY_PASSWORD:-HbSecure@2026!Key}"
            
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS_VAL" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

            echo "Verifying keystore integrity and password..."
            if ! keytool -list -keystore android/keystore/release.keystore -storepass "$KEYSTORE_PASS" > /tmp/keystore_entries.txt 2>&1; then
              echo "::error::Keystore password verification failed! Please check KEYSTORE_PASSWORD in GitHub Secrets."
              cat /tmp/keystore_entries.txt
              exit 1
            fi

            echo "Keystore verified successfully. Aliases found:"
            grep -E "(Alias name|Entry type|PrivateKeyEntry)" /tmp/keystore_entries.txt || cat /tmp/keystore_entries.txt

            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Keystore successfully configured and validated."
          else
            echo "Notice: KEYSTORE_BASE64 not set in GitHub Secrets. Using debug signature."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build APK with Gradle
        env:
          VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
          VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
        run: |
          chmod +x android/gradlew
          cd android
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper jar missing, initializing..."
            gradle wrapper || curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" --stacktrace
          else
            ./gradlew assembleRelease -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" --stacktrace
          fi

      - name: Locate and Rename Output APK
        id: locate_apk
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ORIGINAL_APK=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          else
            ORIGINAL_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$ORIGINAL_APK" ]; then
            echo "Error: APK not found!"
            exit 1
          fi

          TAG_VAL="${FINAL_TAG:-v1.0.0}"
          DEST_APK="Homebox-${TAG_VAL}.apk"
          cp "$ORIGINAL_APK" "$DEST_APK"
          echo "Output APK: $DEST_APK"
          echo "apk_path=$DEST_APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate_apk.outputs.apk_path }}
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true || inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.final_tag }}
          name: Homebox Android ${{ steps.versioning.outputs.final_tag }}
          files: ${{ steps.locate_apk.outputs.apk_path }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
