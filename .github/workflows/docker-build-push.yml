name: Build and Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms (e.g. linux/amd64,linux/arm64 or linux/amd64)'
        required: false
        default: 'linux/amd64,linux/arm64'
      tag_name:
        description: 'Custom image tag (optional, e.g. v1.0.0 or latest)'
        required: false
        default: 'latest'
      push:
        description: 'Push image to registry'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current timestamp
        id: time
        run: echo "now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request' && (github.event.inputs.push != 'false')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub_check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub_check.outputs.enabled == 'true' && github.event_name != 'pull_request' && (github.event.inputs.push != 'false')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker image names
        id: image_names
        run: |
          GHCR_REPO="ghcr.io/${{ github.repository }}"
          echo "ghcr_repo=${GHCR_REPO,,}" >> $GITHUB_OUTPUT
          if [ "${{ steps.dockerhub_check.outputs.enabled }}" = "true" ]; then
            DH_REPO="${{ secrets.DOCKERHUB_REPO || format('{0}/homebox', secrets.DOCKERHUB_USERNAME) }}"
            echo "images=${GHCR_REPO,,},${DH_REPO}" >> $GITHUB_OUTPUT
          else
            echo "images=${GHCR_REPO,,}" >> $GITHUB_OUTPUT
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_names.outputs.images }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version || github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.now }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
